<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="side-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
      <i class="bi bi-grid"></i><span>Home</span>
    </a>
    <a routerLink="/rooms" routerLinkActive="active">
      <i class="bi bi-search"></i><span>Browse Rooms</span>
    </a>
    <a routerLink="/my-rooms" routerLinkActive="active">
      <i class="bi bi-folder"></i><span>My Rooms</span>
    </a>
    <a routerLink="/study-plan" routerLinkActive="active">
      <i class="bi bi-calendar"></i><span>Study Plan</span>
    </a>
    <a routerLink="/progress" routerLinkActive="active">
      <i class="bi bi-graph-up"></i><span>Progress</span>
    </a>
    <a routerLink="/messages" routerLinkActive="active">
      <i class="bi bi-chat"></i><span>Messages</span>
    </a>
    <a routerLink="/profile" routerLinkActive="active" *ngIf="isLoggedIn">
      <i class="bi bi-person"></i><span>Profile</span>
    </a>
  </div>

  <div class="sidebar-bottom">
    <a class="support-link" routerLink="/support">
      <i class="bi bi-question-circle"></i><span>Contact Admin</span>
    </a>

    <!-- Only show user card if actually logged in -->
    <ng-container *ngIf="isLoggedIn; else guestBlock">
      <div class="user-mini" routerLink="/profile" title="View Profile" style="cursor: pointer;">
        <span class="avatar">{{ userInitial }}</span>
        <div>
          <strong>{{ currentUser?.name }}</strong>
          <small>{{ currentUser?.role === 'admin' ? 'ADMIN' : 'STUDENT' }}</small>
        </div>
      </div>
      <button class="logout" type="button" (click)="logout()" title="Log Out">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </ng-container>

    <ng-template #guestBlock>
      <a class="guest-login-link" routerLink="/login">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Sign In</span>
      </a>
    </ng-template>
  </div>
</aside>
