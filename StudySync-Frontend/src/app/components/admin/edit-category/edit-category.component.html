<div class="form-container">
  <!-- Navigation Header -->
  <div class="form-nav">
    <button class="btn-back" (click)="goBack()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Categories</span>
    </button>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <span>Loading category details...</span>
  </div>

  <div class="form-card" *ngIf="!loading">
    <div class="form-header">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </div>
      <div>
        <h1 class="card-title">Edit Category</h1>
        <p class="card-subtitle">Update name and curriculum description for this study category.</p>
      </div>
    </div>

    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="category-form">
      <div class="form-group">
        <label for="name">Category Name <span class="required">*</span></label>
        <input
          id="name"
          type="text"
          formControlName="name"
          class="form-input"
          [class.input-error]="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid"
        />
        <span class="error-msg" *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.errors?.['required']">
          Category name is required.
        </span>
      </div>

      <div class="form-group">
        <label for="description">Description <span class="required">*</span></label>
        <textarea
          id="description"
          rows="4"
          formControlName="description"
          class="form-textarea"
          [class.input-error]="categoryForm.get('description')?.touched && categoryForm.get('description')?.invalid"
        ></textarea>
        <span class="error-msg" *ngIf="categoryForm.get('description')?.touched && categoryForm.get('description')?.errors?.['required']">
          Description is required.
        </span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="goBack()">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="submitting">
          <span *ngIf="!submitting">Save Changes</span>
          <span *ngIf="submitting">Saving...</span>
        </button>
      </div>
    </form>
  </div>
</div>
