<div class="admin-wrapper">
  <!-- Admin Top Navbar -->
  <header class="admin-topbar">
    <a class="brand" routerLink="/admin">
      <img src="assets/images/studysync-logo.png" alt="StudySync Logo" class="brand-logo-img">
      <div class="brand-text">
        <span class="title">StudySync</span>
        <small class="tag">ADMIN PORTAL</small>
      </div>
    </a>

    <div class="topbar-actions">
      <div class="user-chip">
        <span class="avatar">{{ (currentAdmin?.name || 'Admin').charAt(0) }}</span>
        <span class="name">{{ currentAdmin?.name || 'Administrator' }}</span>
      </div>
    </div>
  </header>

  <div class="admin-body">
    <!-- Admin Sidebar Navigation -->
    <aside class="admin-sidebar">
      <nav class="admin-nav">
        <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Dashboard</span>
        </a>

        <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Users</span>
        </a>

        <a routerLink="/admin/rooms" routerLinkActive="active" class="nav-item">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
          <span>Rooms</span>
        </a>

        <a routerLink="/admin/categories" routerLinkActive="active" class="nav-item">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>Categories</span>
        </a>

        <a routerLink="/admin/support" routerLinkActive="active" class="nav-item">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Support Inbox</span>
        </a>

        <div class="nav-divider"></div>

        <a routerLink="/rooms" class="nav-item switch-portal-item" title="Switch to Normal User Dashboard">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>User Dashboard</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-footer">
          <div class="system-status">
            <span class="status-dot"></span>
            <span>System Online</span>
          </div>
          <small class="version">StudySync v2.4 Admin</small>
        </div>

        <button class="btn-sidebar-logout" (click)="logout()" title="Sign Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="admin-main-container">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
