<div class="form-container">
  <!-- Navigation Header -->
  <div class="form-nav">
    <button class="btn-back" (click)="goBack()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Categories</span>
    </button>
  </div>

  <div class="form-card">
    <div class="form-header">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </div>
      <div>
        <h1 class="card-title">Create New Category</h1>
        <p class="card-subtitle">Add a new academic subject classification for study room creators.</p>
      </div>
    </div>

    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="category-form">
      <div class="form-group">
        <label for="name">Category Name <span class="required">*</span></label>
        <input
          id="name"
          type="text"
          formControlName="name"
          placeholder="e.g., Artificial Intelligence & Robotics"
          class="form-input"
          [class.input-error]="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid"
        />
        <span class="error-msg" *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.errors?.['required']">
          Category name is required.
        </span>
        <span class="error-msg" *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.errors?.['minlength']">
          Must be at least 3 characters.
        </span>
      </div>

      <div class="form-group">
        <label for="description">Description <span class="required">*</span></label>
        <textarea
          id="description"
          rows="4"
          formControlName="description"
          placeholder="Provide a clear description of topics, scope, and target domains..."
          class="form-textarea"
          [class.input-error]="categoryForm.get('description')?.touched && categoryForm.get('description')?.invalid"
        ></textarea>
        <span class="error-msg" *ngIf="categoryForm.get('description')?.touched && categoryForm.get('description')?.errors?.['required']">
          Description is required.
        </span>
        <span class="error-msg" *ngIf="categoryForm.get('description')?.touched && categoryForm.get('description')?.errors?.['minlength']">
          Must be at least 10 characters.
        </span>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="goBack()">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="submitting">
          <span *ngIf="!submitting">Create Category</span>
          <span *ngIf="submitting">Saving...</span>
        </button>
      </div>
    </form>
  </div>
</div>
