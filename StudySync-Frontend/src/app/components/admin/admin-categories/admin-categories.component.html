<div class="categories-container">
  <!-- Header -->
  <div class="page-head">
    <div>
      <h1 class="page-title">Category Management</h1>
      <p class="page-subtitle">Configure academic subjects, topics, and room taxonomies across StudySync.</p>
    </div>
    <button class="btn-primary-add" (click)="goToCreate()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Create Category</span>
    </button>
  </div>

  <!-- Search Filter -->
  <div class="filter-card">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        placeholder="Search categories by name or keyword..."
        [(ngModel)]="searchTerm"
        class="search-input"
      />
    </div>
    <span class="count-badge">{{ filteredCategories.length }} Categories</span>
  </div>

  <!-- Category Cards Grid -->
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <span>Loading categories...</span>
  </div>

  <div *ngIf="!loading && filteredCategories.length === 0" class="empty-state">
    <p>No categories found.</p>
  </div>

  <div *ngIf="!loading && filteredCategories.length > 0" class="categories-grid">
    <div class="category-card" *ngFor="let cat of filteredCategories">
      <div class="cat-card-header">
        <div class="cat-icon-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div class="cat-card-actions">
          <button class="btn-action edit" (click)="goToEdit(cat)" title="Edit Category">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
          <button class="btn-action delete" (click)="deleteCategory(cat)" title="Delete Category">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>

      <h3 class="cat-title">{{ cat.name }}</h3>
      <p class="cat-description">{{ cat.description || 'No description provided.' }}</p>

      <div class="cat-footer">
        <span class="cat-id-chip">ID: {{ cat._id || cat.id }}</span>
        <button class="btn-edit-link" (click)="goToEdit(cat)">Edit Details →</button>
      </div>
    </div>
  </div>
</div>
