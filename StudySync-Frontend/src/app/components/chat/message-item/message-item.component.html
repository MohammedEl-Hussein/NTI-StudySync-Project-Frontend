<div
  class="message-wrapper"
  [class.mine]="isMine"
  [class.pending]="message.isPending"
  [class.first-in-group]="isFirstInGroup"
  [class.last-in-group]="isLastInGroup"
  [class.single-in-group]="isFirstInGroup && isLastInGroup"
>
  <!-- Avatar Column for other users (at bottom of consecutive group) -->
  <div class="avatar-col" *ngIf="!isMine">
    <span
      class="avatar"
      *ngIf="isLastInGroup"
      [style.background]="getAvatarColor(senderName)"
    >
      {{ avatarInitial }}
    </span>
    <div class="avatar-placeholder" *ngIf="!isLastInGroup"></div>
  </div>

  <div class="message-content-box">
    <!-- Sender header (only shown once at top of consecutive message group for other users) -->
    <div class="message-meta" *ngIf="isFirstInGroup && !isMine">
      <span class="sender-name">{{ senderName }}</span>
      <span *ngIf="isRoomHost" class="host-badge">
        <i class="bi bi-star-fill"></i> Host
      </span>
    </div>

    <!-- Bubble -->
    <div class="bubble-container">
      <div class="bubble">
        <p class="text">{{ message.content }}</p>
      </div>

      <!-- Action buttons menu (hover) -->
      <div class="message-actions" *ngIf="!message.isPending">
        <button
          type="button"
          class="action-btn"
          (click)="copyContent()"
          [title]="copied ? 'Copied!' : 'Copy text'"
        >
          <i [class]="copied ? 'bi bi-check-lg' : 'bi bi-clipboard'"></i>
        </button>

        <button
          *ngIf="canEdit"
          type="button"
          class="action-btn"
          (click)="onEdit()"
          title="Edit message"
        >
          <i class="bi bi-pencil-square"></i>
        </button>

        <button
          *ngIf="canDelete"
          type="button"
          class="action-btn danger"
          (click)="onDelete()"
          title="Delete message"
        >
          <i class="bi bi-trash3"></i>
        </button>
      </div>
    </div>

    <!-- Timestamp ONLY under the message (and only under the last message in that moment) -->
    <div class="message-footer-meta" *ngIf="isLastInGroup">
      <time class="message-time-under" [title]="formattedFullDate">
        {{ formattedTime }}
      </time>
      <span *ngIf="isEdited" class="edited-tag">(edited)</span>
      <span *ngIf="message.isPending" class="sending-tag">
        <i class="bi bi-clock"></i> sending...
      </span>
    </div>
  </div>

  <!-- Avatar Column for current user (mine) -->
  <div class="avatar-col" *ngIf="isMine">
    <span class="avatar mine-avatar" *ngIf="isLastInGroup">
      <i class="bi bi-person-fill"></i>
    </span>
    <div class="avatar-placeholder" *ngIf="!isLastInGroup"></div>
  </div>
</div>
