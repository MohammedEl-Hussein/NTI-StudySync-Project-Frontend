<div class="chat-room-container card">
  <!-- Header -->
  <app-chat-header
    *ngIf="showHeader"
    [room]="room"
    [memberCount]="members.length"
    [onlineCount]="onlineCount"
    [isMembersOpen]="isMembersOpen"
    [showBackBtn]="showBackBtn"
    (toggleMembers)="toggleMembers()"
    (backToRoom)="navigateBackToRoom()"
  ></app-chat-header>

  <!-- Chat Workspace -->
  <div class="chat-workspace">
    <!-- Main Chat Column -->
    <main class="chat-main-panel">
      <!-- Message List -->
      <app-message-list
        [messages]="messages"
        [currentUserId]="currentUserId"
        [isRoomOwnerOrAdmin]="isRoomOwnerOrAdmin"
        [isLoading]="isLoadingMessages"
        [room]="room"
        (editMessage)="openEditModal($event)"
        (deleteMessage)="openDeleteModal($event)"
      ></app-message-list>

      <!-- Message Composer -->
      <app-message-input
        [disabled]="isLoadingMessages"
        (sendMessage)="onSendMessage($event)"
      ></app-message-input>
    </main>

    <!-- Members Sidebar -->
    <app-chat-members
      *ngIf="isMembersOpen"
      [members]="members"
      [ownerId]="room?.ownerId"
      [adminIds]="room?.adminIds || []"
      [currentUserId]="currentUserId"
      [messages]="messages"
      [isOpen]="isMembersOpen"
      (close)="toggleMembers()"
    ></app-chat-members>
  </div>

  <!-- Edit Message Modal -->
  <app-edit-message
    [isOpen]="isEditModalOpen"
    [message]="editingMessage"
    [isSaving]="isSavingEdit"
    (save)="onSaveEdit($event)"
    (cancel)="closeEditModal()"
  ></app-edit-message>

  <!-- Delete Message Modal -->
  <app-delete-message
    [isOpen]="isDeleteModalOpen"
    [message]="deletingMessage"
    [isDeleting]="isDeletingMsg"
    (confirm)="onConfirmDelete($event)"
    (cancel)="closeDeleteModal()"
  ></app-delete-message>
</div>
