<header class="chat-header">
  <div class="header-left">
    <button *ngIf="showBackBtn" class="btn-icon back-btn" (click)="onBack()" title="Back to Room Overview">
      <i class="bi bi-arrow-left"></i>
    </button>

    <div class="room-avatar">
      <i class="bi bi-chat-dots-fill"></i>
    </div>

    <div class="room-info">
      <div class="room-title-row">
        <h2 class="room-title">{{ room?.title || 'Study Room Chat' }}</h2>
        <span *ngIf="room?.level" class="room-badge">{{ room?.level }}</span>
      </div>
      <div class="room-status-row">
        <span class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">{{ onlineCount > 0 ? onlineCount + ' active now' : 'Room Active' }}</span>
        </span>
        <span class="separator">·</span>
        <span class="members-count">{{ memberCount }} {{ memberCount === 1 ? 'member' : 'members' }}</span>
        <span *ngIf="room?.ownerId" class="host-info">
          <span class="separator">·</span> Host: <strong>{{ room?.ownerId?.name || 'Instructor' }}</strong>
        </span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <a *ngIf="room?.meetingURL" [href]="room?.meetingURL" target="_blank" class="btn-meeting" title="Join Video Session">
      <i class="bi bi-camera-video-fill"></i>
      <span>Join Meeting</span>
    </a>

    <button class="btn-toggle-members" [class.active]="isMembersOpen" (click)="onToggleMembers()" title="Toggle Members Sidebar">
      <i class="bi bi-people-fill"></i>
      <span class="members-btn-text">Members ({{ memberCount }})</span>
    </button>
  </div>
</header>
