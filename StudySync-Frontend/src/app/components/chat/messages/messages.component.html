<app-navbar></app-navbar><app-sidebar></app-sidebar>
<main class="page"><div class="page-header"><div><h1>Messages</h1><p>Chat with your study room partners.</p></div></div>
<div class="messages-layout"><aside class="card conversations"><input class="input" placeholder="Search conversations..." [(ngModel)]="search"><button *ngFor="let chat of filteredChats" type="button" [class.active]="selectedChat?._id===chat._id" (click)="openChat(chat)"><span class="avatar">{{ chat.roomId?.title?.charAt(0) }}</span><div><strong>{{ chat.roomId?.title }}</strong><small>{{ chat.lastMessage || 'Start the conversation' }}</small></div></button></aside><section class="card conversation-view"><app-chat-room *ngIf="selectedChat" [roomId]="selectedChat.roomId?._id"></app-chat-room><app-empty-state *ngIf="!selectedChat" icon="▢" title="Start the conversation" message="Select a room to chat with your study group partners."></app-empty-state></section></div></main>
