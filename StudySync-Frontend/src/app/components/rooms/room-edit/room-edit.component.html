<app-navbar></app-navbar><app-sidebar></app-sidebar>
<main class="page"><div class="page-header"><div><h1>Edit Study Room</h1><p>Update the room information and settings.</p></div><a class="btn secondary" [routerLink]="['/rooms',room?._id]">Cancel</a></div>
<form class="card edit-form" [formGroup]="roomForm" (ngSubmit)="save()"><div class="grid2"><label class="form-label">Room Name<input class="input" formControlName="title"></label><label class="form-label">Study Level<select class="select" formControlName="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label class="form-label full-row">Description<textarea class="textarea" formControlName="description"></textarea></label><label class="form-label">Maximum Members<input class="input" type="number" formControlName="maxMembers"></label><label class="form-label">Meeting URL<input class="input" formControlName="meetingURL"></label><label class="form-label">Start Date<input class="input" type="date" formControlName="startDate"></label><label class="form-label">End Date<input class="input" type="date" formControlName="endDate"></label></div><div class="actions"><button class="btn danger" type="button" (click)="deleteRoom()">Delete Room</button><button class="btn primary" type="submit">Save Changes</button></div></form></main>
