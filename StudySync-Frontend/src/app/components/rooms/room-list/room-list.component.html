<!-- Assuming Navbar/Sidebar are outside or imported here -->
<main class="page">
  <div class="page-header">
    <div>
      <h1>Find your next study room</h1>
      <p>Join focused circles matching your goals and build habits.</p>
    </div>
  </div>
  
  <section class="filters card">
    <input class="input search" placeholder="Search by topic or room name..." [(ngModel)]="filters.search" (input)="applyFilters()">
    <select class="select" [(ngModel)]="filters.category" (change)="applyFilters()">
      <option value="">Category: All Subjects</option>
      <option *ngFor="let c of categories" [value]="c._id">{{ c.name }}</option>
    </select>
    <select class="select" [(ngModel)]="filters.level" (change)="applyFilters()">
      <option value="">Level: All Levels</option>
      <option value="Beginner">Beginner</option>
      <option value="Intermediate">Intermediate</option>
      <option value="Advanced">Advanced</option>
    </select>
    <select class="select" [(ngModel)]="filters.vacancy" (change)="applyFilters()">
      <option value="">Availability: Any</option>
      <option value="available">Has Vacancy</option>
    </select>
    <select class="select" [(ngModel)]="filters.sort" (change)="applyFilters()">
      <option value="Most Members">Most Members</option>
      <option value="Newest">Newest</option>
      <option value="Progress">Progress</option>
    </select>
  </section>

  <div class="room-grid" *ngIf="filteredRooms.length > 0">
    <app-room-card *ngFor="let room of filteredRooms" [room]="room" (join)="joinRoom($event)"></app-room-card>
  </div>

  <div *ngIf="!loading && !filteredRooms.length" class="card text-center my-5" style="padding: 40px">
    <h3>No study rooms found</h3>
    <p>Try changing your filters or search terms.</p>
    <button class="btn secondary" (click)="clearFilters()">Clear filters</button>
  </div>

  <div *ngIf="loading" class="text-center my-5">Loading...</div>
</main>
