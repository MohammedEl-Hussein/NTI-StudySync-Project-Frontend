<app-navbar></app-navbar><app-sidebar></app-sidebar>
<main class="page"><div class="page-header"><div><h1>Add Study Task</h1><p>Create a task for a room section.</p></div></div>
<form class="card form-card" [formGroup]="taskForm" (ngSubmit)="save()"><label class="form-label">Section<input class="input" formControlName="section" placeholder="e.g. Phase 1 — JavaScript Fundamentals"></label><label class="form-label">Task Title<input class="input" formControlName="title" placeholder="e.g. Variables & Scope"></label><label class="form-label">Description<textarea class="textarea" formControlName="description" placeholder="Describe what members should complete..."></textarea></label><div class="grid2"><label class="form-label">Order<input class="input" type="number" formControlName="order" min="1"></label><label class="form-label">Due Date<input class="input" type="date" formControlName="dueDate"></label></div><div class="actions"><a class="btn secondary" [routerLink]="['/rooms',roomId]">Cancel</a><button class="btn primary" type="submit">Create Task</button></div></form></main>
