<app-navbar></app-navbar><app-sidebar></app-sidebar>
<main class="page"><div class="page-header"><div><h1>Edit Task</h1><p>Update the task details and deadline.</p></div></div>
<form class="card form-card" [formGroup]="taskForm" (ngSubmit)="save()"><label class="form-label">Section<input class="input" formControlName="section"></label><label class="form-label">Task Title<input class="input" formControlName="title"></label><label class="form-label">Description<textarea class="textarea" formControlName="description"></textarea></label><div class="grid2"><label class="form-label">Order<input class="input" type="number" formControlName="order"></label><label class="form-label">Due Date<input class="input" type="date" formControlName="dueDate"></label></div><div class="actions"><button class="btn danger" type="button" (click)="delete()">Delete</button><button class="btn primary" type="submit">Save Changes</button></div></form></main>
