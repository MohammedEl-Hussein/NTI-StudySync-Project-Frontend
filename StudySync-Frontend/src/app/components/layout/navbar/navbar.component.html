<header class="topbar">
  <a class="brand" routerLink="/" aria-label="StudySync home">
    <span class="brand-mark">S</span>
    <span>StudySync</span>
  </a>

  <div class="topbar-search">
    <span class="search-icon">⌕</span>
    <input type="search" placeholder="Search rooms, topics..." [(ngModel)]="searchTerm" (input)="onSearchInput()" (keyup.enter)="onSearch()">
  </div>

  <div class="topbar-actions">
    <button class="icon-btn notification-btn" type="button" (click)="toggleNotifications()" aria-label="Notifications">
      ♧
      <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
    </button>
    <button class="avatar-btn" type="button" routerLink="/profile">
      <span class="avatar">{{ currentUser?.name?.charAt(0) || 'U' }}</span>
      <span class="chevron">⌄</span>
    </button>
  </div>

  <div class="notification-panel" *ngIf="notificationsOpen">
    <div class="notification-head">
      <strong>Notifications</strong>
      <button type="button" (click)="markAllRead()" *ngIf="unreadCount > 0">Mark all as read</button>
    </div>
    <div class="notification-list">
      <button class="notification-item" 
              *ngFor="let notification of notifications" 
              [class.unread]="!notification.isRead"
              (click)="handleNotificationClick(notification)" 
              type="button">
        <div class="notification-icon">
          <i class="bi" [ngClass]="{
            'bi-chat-dots': notification.type === 'chat',
            'bi-list-task': notification.type === 'task',
            'bi-info-circle': notification.type === 'system',
            'bi-alarm': notification.type === 'reminder'
          }"></i>
        </div>
        <div class="notification-content">
          <strong>{{ notification.title }}</strong>
          <p>{{ notification.message }}</p>
          <span class="notification-time">{{ notification.createdAt | date:'short' }}</span>
        </div>
      </button>
      <div class="notification-item text-muted" *ngIf="notifications.length === 0">
        No notifications yet.
      </div>
    </div>
  </div>
</header>
