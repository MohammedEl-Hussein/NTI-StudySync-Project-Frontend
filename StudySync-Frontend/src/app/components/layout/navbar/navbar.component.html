<header class="topbar">
  <!-- Brand Logo -->
  <div class="brand" aria-label="StudySync home">
    <img src="assets/images/studysync-logo.png" alt="StudySync Logo" class="brand-logo-img">
    <span>StudySync</span>
  </div>

  <!-- Global Search Bar -->
  <div class="topbar-search">
    <i class="bi bi-search search-icon"></i>
    <input 
      type="search" 
      placeholder="Search rooms, tasks, topics..." 
      [(ngModel)]="searchTerm" 
      (input)="onSearchInput()" 
      (keyup.enter)="onSearch()"
    />
  </div>

  <!-- Actions: Notifications & User Avatar Menu -->
  <div class="topbar-actions">
    <!-- Admin Portal Shortcut (Visible ONLY to Admin users) -->
    <a class="btn-admin-portal" routerLink="/admin" *ngIf="isAdmin" title="Switch to Admin Portal">
      <i class="bi bi-shield-lock-fill"></i>
      <span>Admin Portal</span>
    </a>

    <!-- Notification Bell Button -->
    <button 
      class="icon-btn notification-btn" 
      type="button" 
      (click)="toggleNotifications($event)" 
      aria-label="Notifications"
      title="Notifications"
    >
      <i class="bi bi-bell-fill"></i>
      <span class="notify-badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
    </button>

    <!-- When Logged In: User Profile Dropdown Trigger -->
    <div class="user-menu-wrapper" *ngIf="isLoggedIn">
      <button 
        class="avatar-btn" 
        type="button" 
        (click)="toggleProfileMenu($event)"
        aria-label="User profile menu"
      >
        <span class="avatar">{{ userInitial }}</span>
        <i class="bi bi-chevron-down chevron" [class.rotated]="profileMenuOpen"></i>
      </button>

      <!-- Profile Dropdown Menu -->
      <div class="profile-dropdown-menu" *ngIf="profileMenuOpen" (click)="$event.stopPropagation()">
        <!-- User Info Header -->
        <div class="dropdown-user-header" routerLink="/profile" (click)="closeDropdowns()">
          <div class="big-drop-avatar">{{ userInitial }}</div>
          <div class="drop-user-details">
            <strong>{{ currentUser?.name }}</strong>
            <small>{{ currentUser?.email }}</small>
            <span class="role-pill">{{ currentUser?.role === 'admin' ? 'Admin' : 'Student' }}</span>
          </div>
        </div>

        <div class="dropdown-divider"></div>

        <!-- Admin Portal Link inside Dropdown -->
        <a class="dropdown-link admin-link" routerLink="/admin" (click)="closeDropdowns()" *ngIf="isAdmin">
          <i class="bi bi-shield-lock-fill"></i>
          <span>Admin Portal</span>
        </a>

        <!-- Menu Links -->
        <a class="dropdown-link" routerLink="/profile" (click)="closeDropdowns()">
          <i class="bi bi-person-badge"></i>
          <span>My Profile</span>
        </a>

        <a class="dropdown-link" routerLink="/profile/edit" (click)="closeDropdowns()">
          <i class="bi bi-pencil-square"></i>
          <span>Edit Profile</span>
        </a>

        <a class="dropdown-link" routerLink="/my-rooms" (click)="closeDropdowns()">
          <i class="bi bi-folder2-open"></i>
          <span>My Study Rooms</span>
        </a>

        <a class="dropdown-link" routerLink="/progress" (click)="closeDropdowns()">
          <i class="bi bi-graph-up-arrow"></i>
          <span>Academic Progress</span>
        </a>

        <div class="dropdown-divider"></div>

        <!-- Logout Action -->
        <button class="dropdown-link logout-btn" type="button" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i>
          <span>Log Out</span>
        </button>
      </div>
    </div>

    <!-- When NOT Logged In: Sign In Button -->
    <div *ngIf="!isLoggedIn">
      <a class="btn primary" routerLink="/login" style="padding: 6px 14px; font-size: 12px;">Sign In</a>
    </div>
  </div>

  <!-- Notification Dropdown Panel -->
  <div class="notification-panel" *ngIf="notificationsOpen" (click)="$event.stopPropagation()">
    <div class="notification-head">
      <strong>Notifications</strong>
      <button type="button" (click)="markAllRead()" *ngIf="unreadCount > 0">Mark all as read</button>
    </div>
    <div class="notification-list">
      <button class="notification-item" 
              *ngFor="let notification of notifications" 
              [class.unread]="!notification.isRead"
              (click)="handleNotificationClick(notification)" 
              type="button">
        <div class="notification-icon">
          <i class="bi" [ngClass]="{
            'bi-chat-dots': notification.type === 'chat',
            'bi-list-task': notification.type === 'task',
            'bi-info-circle': notification.type === 'system',
            'bi-alarm': notification.type === 'reminder'
          }"></i>
        </div>
        <div class="notification-content">
          <strong>{{ notification.title }}</strong>
          <p>{{ notification.message }}</p>
          <span class="notification-time">{{ notification.createdAt | date:'short' }}</span>
        </div>
      </button>
      <div class="notification-empty" *ngIf="notifications.length === 0">
        <i class="bi bi-bell-slash"></i>
        <p>No new notifications.</p>
      </div>
    </div>
  </div>
</header>
