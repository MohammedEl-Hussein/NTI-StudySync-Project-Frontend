<main class="page">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1>Support & Help Desk</h1>
      <p>Have a question or need administrative assistance? Submit a ticket and our team will get back to you promptly.</p>
    </div>
  </div>

  <!-- Main Support Grid: Create on left, My Tickets on right -->
  <div class="support-grid">
    <div class="support-left">
      <app-support-create (ticketCreated)="onTicketCreated($event)"></app-support-create>
    </div>

    <div class="support-right">
      <app-my-support-tickets #myTickets></app-my-support-tickets>
    </div>
  </div>
</main>
