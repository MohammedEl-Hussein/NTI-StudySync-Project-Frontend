<div class="members-header"><div><h2>Room Members</h2><p>Manage collaborative roles and view study milestones.</p></div><button class="btn primary" *ngIf="canManage" type="button" (click)="openInvite()">+ Invite Student</button></div>
<div class="members-grid"><article class="member-card" *ngFor="let member of members"><div class="member-head"><span class="avatar">{{ member.userId?.name?.charAt(0) || 'U' }}</span><div><strong>{{ member.userId?.name }}</strong><small>{{ member.userId?.organization || 'Student' }}</small></div><span class="role">{{ member.role || getRole(member.userId?._id) }}</span></div><div class="progress-label"><span>Personal progress</span><strong>{{ member.progress || 0 }}%</strong></div><div class="progress-track"><div class="progress-bar" [style.width.%]="member.progress || 0"></div></div><div class="member-actions" *ngIf="canManage && !isOwner(member)"><button class="btn secondary" type="button" (click)="toggleAdmin(member)">{{ isAdmin(member) ? 'Demote' : 'Make Admin' }}</button><button class="btn danger" type="button" (click)="removeMember(member)">Remove</button></div><div class="member-actions" *ngIf="isOwner(member)"><button class="btn secondary full" type="button">Owner</button></div></article></div>
