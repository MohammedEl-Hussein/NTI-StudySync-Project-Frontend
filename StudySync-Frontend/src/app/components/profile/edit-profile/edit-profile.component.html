<main class="page">
  <div class="page-header">
    <div>
      <div class="breadcrumbs">
        <a routerLink="/profile">My Profile</a>
        <span>&rsaquo;</span>
        <strong>Edit Profile</strong>
      </div>
      <h1>Edit Academic Profile</h1>
      <p>Update your personal info, institutional credentials, and biography.</p>
    </div>
    <div class="header-actions">
      <button class="btn secondary" type="button" (click)="onCancel()">Cancel</button>
      <button class="btn primary" type="button" [disabled]="saving" (click)="onSubmit()">
        <span *ngIf="!saving">Save Changes</span>
        <span *ngIf="saving">Saving...</span>
      </button>
    </div>
  </div>

  <div class="card form-card">
    <div *ngIf="successMessage" class="alert success-alert">
      <i class="bi bi-check-circle-fill"></i>
      <span>{{ successMessage }}</span>
    </div>

    <div *ngIf="errorMessage" class="alert error-alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="form-grid-2">
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="input" type="text" formControlName="name" placeholder="e.g. Haneen Al-Sayed" />
          <small class="error-text" *ngIf="f['name'].touched && f['name'].invalid">Name is required (min 2 chars).</small>
        </div>

        <!-- Age -->
        <div class="form-group">
          <label class="form-label">Age</label>
          <input class="input" type="number" formControlName="age" placeholder="e.g. 22" />
        </div>
      </div>

      <div class="form-grid-2">
        <!-- Study Level -->
        <div class="form-group">
          <label class="form-label">Study Level *</label>
          <select class="select" formControlName="studyLevel">
            <option *ngFor="let lvl of studyLevelOptions" [value]="lvl">{{ lvl }}</option>
          </select>
        </div>

        <!-- Gender -->
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select class="select" formControlName="gender">
            <option *ngFor="let g of genderOptions" [value]="g">{{ g }}</option>
          </select>
        </div>
      </div>

      <div class="form-grid-2">
        <!-- Organization / University -->
        <div class="form-group">
          <label class="form-label">University / Organization</label>
          <input class="input" type="text" formControlName="organization" placeholder="e.g. Faculty of Engineering & CS" />
        </div>

        <!-- Department -->
        <div class="form-group">
          <label class="form-label">Department / Major</label>
          <input class="input" type="text" formControlName="department" placeholder="e.g. Computer Science" />
        </div>
      </div>

      <div class="form-group">
        <!-- Phone -->
        <label class="form-label">Phone Number</label>
        <input class="input" type="tel" formControlName="phone" placeholder="e.g. +20 100 234 5678" />
      </div>

      <div class="form-group">
        <!-- Bio -->
        <label class="form-label">Biography & Academic Goals</label>
        <textarea class="textarea" formControlName="bio" placeholder="Tell your study cohort peers about your background, interests, and research areas..."></textarea>
      </div>

      <div class="form-actions-bottom">
        <button class="btn secondary" type="button" (click)="onCancel()">Cancel</button>
        <button class="btn primary" type="submit" [disabled]="saving">
          <span *ngIf="!saving">Save Changes</span>
          <span *ngIf="saving">Saving...</span>
        </button>
      </div>
    </form>
  </div>
</main>
